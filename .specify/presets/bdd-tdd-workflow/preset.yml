schema_version: "1.0"

preset:
  id: "bdd-tdd-workflow"
  name: "BDD/TDD Workflow"
  version: "1.0.0"
  description: "Behavior Pathways in spec.md, a hard-fail BH/TEST traceability check in verify-spec, and test-first (red-then-green) enforcement in implement -- opt-in, binding once installed, not advisory. Mirrors Olivia Jiang's PM-plugin BDD/TDD design (risk-tiered FULL/STANDARD) onto the engineering-side SDD lifecycle. See docs/superpowers/specs/2026-08-25-bdd-tdd-workflow-capability-design.md."
  author: "TradeStation ABS"
  license: MIT

requires:
  speckit_version: ">=0.7.3"

provides:
  templates:
    - { type: "template", name: "spec-template", file: "templates/spec-template.md", strategy: "append" }
    - { type: "command", name: "speckit.specify", file: "commands/speckit.specify.md", strategy: "append" }
    - { type: "agent", name: "speckit.specify.agent", file: "agents/speckit.specify.agent.md", strategy: "append" }
    - { type: "command", name: "speckit.verify-spec", file: "commands/speckit.verify-spec.md", strategy: "append" }
    - { type: "agent", name: "speckit.verify-spec.agent", file: "agents/speckit.verify-spec.agent.md", strategy: "append" }
    - { type: "command", name: "speckit.plan", file: "commands/speckit.plan.md", strategy: "append" }
    - { type: "agent", name: "speckit.plan.agent", file: "agents/speckit.plan.agent.md", strategy: "append" }
    - { type: "command", name: "speckit.tasks", file: "commands/speckit.tasks.md", strategy: "append" }
    - { type: "agent", name: "speckit.tasks.agent", file: "agents/speckit.tasks.agent.md", strategy: "append" }
    - { type: "command", name: "speckit.implement", file: "commands/speckit.implement.md", strategy: "append" }
    - { type: "agent", name: "speckit.implement.agent", file: "agents/speckit.implement.agent.md", strategy: "append" }

tags:
  - "sdd"
  - "bdd"
  - "tdd"
  - "capability"
