schema_version: "1.0"

preset:
  id: "tradestation-sdd"
  name: "TradeStation SDD"
  version: "1.0.0"
  description: "Spec-Driven Development preset with constitution principles, test-mandatory task generation, and plan-level test strategy"
  author: "TradeStation"

requires:
  speckit_version: ">=0.5.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Project constitution with 5 principles and quality gates"
      replaces: "constitution-template"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Tech-agnostic feature specs with prioritized user stories"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-addendum.md"
      description: "Implementation plans with test strategy section (wraps core plan template)"
      strategy: "wrap"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Task generation with test-mandatory policy"
      replaces: "tasks-template"

    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Requirements quality checklists"
      replaces: "checklist-template"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Generate or amend the project constitution; auto-triggers feedback"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Generate a feature spec.md; auto-triggers feedback"

    - type: "command"
      name: "speckit.verify-spec"
      file: "commands/speckit.verify-spec.md"
      description: "Blocking gate — verify spec quality before /speckit.plan; refuses planning if standards aren't met. Auto-triggers feedback"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Generate plan.md (and persona plans); refuses to run without a passing spec-verification.md. Auto-triggers feedback"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Generate tasks.md (and persona task files); auto-triggers feedback"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Generate a domain-specific quality checklist; auto-triggers feedback"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Cross-check spec/plan/tasks for drift and gaps; auto-triggers feedback"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement tasks with hygiene + story-review gates; auto-triggers feedback at each Story-Complete checkpoint and end-of-feature"

    - type: "command"
      name: "speckit.review"
      file: "commands/speckit.review.md"
      description: "Independent second-pass code review of the working branch's diff vs main; writes findings to specs/<feature>/code-review.md and auto-triggers feedback. Complements — does not replace — human review"

    - type: "command"
      name: "speckit.feedback"
      file: "commands/speckit.feedback.md"
      description: "Capture phase-tagged developer feedback on the SDD workflow and post to the central sink"

    # Copilot CLI equivalents of the commands above (one-to-one; same
    # names, "agents/<x>.agent.md" instead of "commands/<x>.md"). Without
    # these, render-lib.sh's composition loop has no pristine org-baseline
    # layer to compose capability content onto/fall back to for the
    # Copilot surface -- see install.sh's agents/ copy step for the bug
    # this fixes.
    - type: "agent"
      name: "speckit.constitution.agent"
      file: "agents/speckit.constitution.agent.md"
      description: "Copilot CLI agent for speckit.constitution"

    - type: "agent"
      name: "speckit.specify.agent"
      file: "agents/speckit.specify.agent.md"
      description: "Copilot CLI agent for speckit.specify"

    - type: "agent"
      name: "speckit.verify-spec.agent"
      file: "agents/speckit.verify-spec.agent.md"
      description: "Copilot CLI agent for speckit.verify-spec"

    - type: "agent"
      name: "speckit.plan.agent"
      file: "agents/speckit.plan.agent.md"
      description: "Copilot CLI agent for speckit.plan"

    - type: "agent"
      name: "speckit.tasks.agent"
      file: "agents/speckit.tasks.agent.md"
      description: "Copilot CLI agent for speckit.tasks"

    - type: "agent"
      name: "speckit.checklist.agent"
      file: "agents/speckit.checklist.agent.md"
      description: "Copilot CLI agent for speckit.checklist"

    - type: "agent"
      name: "speckit.analyze.agent"
      file: "agents/speckit.analyze.agent.md"
      description: "Copilot CLI agent for speckit.analyze"

    - type: "agent"
      name: "speckit.implement.agent"
      file: "agents/speckit.implement.agent.md"
      description: "Copilot CLI agent for speckit.implement"

    - type: "agent"
      name: "speckit.review.agent"
      file: "agents/speckit.review.agent.md"
      description: "Copilot CLI agent for speckit.review"

    - type: "agent"
      name: "speckit.feedback.agent"
      file: "agents/speckit.feedback.agent.md"
      description: "Copilot CLI agent for speckit.feedback"

  scripts:
    - type: "script"
      name: "post-feedback"
      file: "scripts/post-feedback.py"
      description: "Send captured feedback as telemetry to the AI Portal backend; caches a personal token via loopback auth, spools and retries when offline. Never blocks the workflow."
    - type: "script"
      name: "post-feedback-shim"
      file: "scripts/post-feedback.sh"
      description: "Back-compat shim that execs post-feedback.py"

tags:
  - "sdd"
  - "spec-driven"
  - "tradestation"
  - "testing"
