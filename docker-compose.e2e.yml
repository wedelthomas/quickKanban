# Overrides for the browser suite.
#
# The E2E stack runs with Jira deliberately unconfigured. With a real token the
# scheduler imports the user's actual assigned issues at unpredictable moments,
# which lands cards in the middle of assertions about the board's contents and
# makes the suite flaky in a way that looks like application bugs.
#
# Nothing is lost: the Jira browser tests seed cards directly (see
# tests/e2e/reset.ts) precisely so they do not depend on what happens to be
# assigned today, and the sync-status tests intercept the status endpoint.
#
# It also runs against its OWN database, kanban_e2e, on the same container.
# tests/e2e/reset.ts truncates every card between tests, and until this override
# existed it truncated the developer's real board — verified the hard way, by
# running the suite and watching thirteen cards and the configured author name
# disappear. The acceptance suite has always had a separate database
# (docker-compose.test.yml); the browser suite simply never did.
#
# `name:` here is load-bearing, not decoration: without it this file inherits
# docker-compose.yml's project name and `test:e2e` recreates the developer's
# own `app` container (with these blank Jira credentials) in place — verified
# the hard way too, when a `down -v` run against "the e2e stack" turned out to
# be a `down -v` against the one and only `quick-kanban-wall` project and took
# the real board's volume with it. `docker-compose.test.yml` already isolates
# the acceptance suite the same way; this gives the browser suite its own
# containers, network and volume so it can never touch the persistent instance.
name: quick-kanban-wall-e2e

services:
  app:
    # A different host port too, not just a different project: the persistent
    # instance already holds 127.0.0.1:3000, and the two must be able to run
    # at once — a developer testing a change should not have to choose
    # between "run e2e" and "keep the real board reachable".
    # Compose merges `ports:` lists additively across files rather than
    # replacing them, so the base file's 3000 mapping would otherwise still
    # be requested alongside this one — `!override` replaces it instead.
    ports: !override
      - '127.0.0.1:3100:3000'
    environment:
      JIRA_BASE_URL: ''
      JIRA_EMAIL: ''
      JIRA_API_TOKEN: ''
      DATABASE_URL: postgres://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kanban_e2e
